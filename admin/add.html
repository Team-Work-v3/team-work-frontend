<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/css/main-admin.css">
    <script src="src/js/events.js"></script>
</head>
<body>
    <header>
        <p class="header-name">ITeen Academy</p>
    </header>
    <main>
    <section class="left-categories">
      <nav class="nav-menu">
        <div class="nav-item">
          <div class="choose-event-circle"></div>
          <a href="/admin/events" class="choose-event-text">Мероприятия</a>
          <svg class="hover-triangle" width="23" height="36" viewBox="0 0 23 36" xmlns="http://www.w3.org/2000/svg">
              <path d="M23 36.1704V1.10275V0L0 18.0852L23 36.1704Z" fill="white" fill-opacity="1" />
          </svg>
        </div>
        <div class="nav-item">
          <div class="choose-event-circle"></div>
          <a href="/admin/members" class="choose-event-text">Участники</a>
          <svg class="hover-triangle" width="23" height="36" viewBox="0 0 23 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 36.1704V1.10275V0L0 18.0852L23 36.1704Z" fill="white" fill-opacity="1" />
          </svg>
        </div>
        <div class="nav-item">
          <svg class="hover-triangle" width="23" height="36" viewBox="0 0 23 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 36.1704V1.10275V0L0 18.0852L23 36.1704Z" fill="white" fill-opacity="1" />
          </svg>
          <div class="choose-event-circle"></div>
          <a href="/admin/analitic" class="choose-event-text">Аналитика</a>
        </div>
        <div class="nav-item">
          <svg class="hover-triangle" width="23" height="36" viewBox="0 0 23 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 36.1704V1.10275V0L0 18.0852L23 36.1704Z" fill="white" fill-opacity="1" />
          </svg>
          <div class="choose-event-circle"></div>
          <a href="" class="choose-event-text">Категории</a>
        </div>
        <div class="nav-item">
          <svg class="hover-triangle" width="23" height="36" viewBox="0 0 23 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 36.1704V1.10275V0L0 18.0852L23 36.1704Z" fill="white" fill-opacity="1" />
          </svg>
          <div class="choose-event-circle"></div>
          <a href="/admin/other" class="choose-event-text">Другое</a>
        </div>
      </nav>
    </section>
    <form>
          <section class="events-container">
        <button class="add-event-button" id="add-event-button" onclick="window.location.href = './admin-add-event.html'">Add event</button>
    </section>
        <label for="name">Название мероприятия</label><br>
        <input type="text" name="name-event" id="name" onblur="NameValidate(this)">
        <span class="error-event" id="nameError">Неправильно введено поле</span><br>

        <label for="description">Описание мероприятия</label><br>
        <textarea type="text" name="description-event" id="description" onblur="DescriptionValidate(this)"></textarea>
        <span class="error-event" id="descriptionError">Неправильно введено поле</span><br>

        <label for="date">Дата</label><br>
        <input type="date" name="date-event" id="date" onblur="DateValidate(this)">
        <span class="error-event" id="dateError">Неправильно введено поле</span><br>

        <label for="time">Время</label><br>
        <input type="time" name="time-event" id="time" onblur="TimeValidate(this)">
        <span class="error-event" id="timeError">Неправильно введено поле</span><br>

        <label for="location">Местоположение</label><br>
        <input type="text" name="location-event" id="location" onblur="LocationValidate(this)">
        <span class="error-event" id="locationError">Неправильно введено поле</span><br>

        <label for="price">Цена</label><br>
        <input type="number" name="price-event" id="price" onblur="PriceValidate(this)">
        <span class="error-event" id="priceError">Неправильно введено поле</span><br>

        <label for="seats">Количество мест</label><br>
        <input type="number" name="seats-event" id="seats" onblur="SeatsValidate(this)">
        <span class="error-event" id="seatsError">Неправильно введено поле</span><br>

        <label for="images">Фоторгафии</label><br>
        <input type="file" multiple accept=".png,.jpeg,.webp,.jpg" name="images-events" id="images" onchange="ImagesValidate(this)">
        <span class="error-event" id="imagesError">Неправильный формат фотографий</span><br>

        <button type="button" onclick="window.location.href = './admin-events.html'">Отмена</button>
        <button type="submit">Создать</button>
    </form>
    </main>
</body>
</html>
