        <div class="container">
  <h1>Добавление отзыва</h1>

  <form id="reviewForm">

    <!-- ФИО -->
    <label>Имя фамилия
      <input type="text" id="fullname" placeholder="Иван Иванов">
      <div class="error" id="nameError"></div>
    </label>

    <!-- Дата -->
    <label>Дата
      <input type="date" id="date">
      <div class="error" id="dateError"></div>
    </label>

    <!-- Содержание -->
    <label>Содержание
      <textarea id="content"></textarea>
      <div class="error" id="contentError"></div>
    </label>

    <!-- Мероприятие -->
    <label>Мероприятие
      <select id="event">
        <option value="">Выберите мероприятие</option>
        <option>Игры роблокс</option>
        <option>IT-форум</option>
        <option>Мастер-класс</option>
      </select>
      <div class="error" id="eventError"></div>
    </label>

    <!-- Иллюстрации -->
    <div class="illustration-block">
      <p>Выберите иллюстрацию</p>
      <div class="icons">
            <img src="svg/lemon.png" data-value="1" />
            <img src="svg/brown.png" data-value="2" />
            <img src="svg/swamp.png" data-value="3" />
            <img src="svg/pink.png" data-value="4" />
            <img src="svg/yellow.png" data-value="5" />
            <img src="svg/yellow.png" data-value="6" />
      </div>
      <div class="error" id="iconError"></div>
    </div>

    <!-- Кнопки -->
    <div class="buttons">
      <button type="submit" class="save">Сохранить</button>
      <button type="button" class="delete" id="clearBtn">Удалить</button>
    </div>

  </form>
</div>
