<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <h1>Мероприятие</h1>

        <form action="#" method="post">
            <div>
                <section>
                    <label for="event-title">Название мероприятия</label>
                    <input id="event-title" name="title" type="text" required>
                </section>

                <section>
                    <label for="event-short-desc">Описание мероприятия (краткое)</label>
                    <textarea id="event-short-desc" name="short_description" rows="3"></textarea>
                </section>

                <section>
                    <label for="event-date">Дата</label>
                    <input id="event-date" name="date" type="date" required>
                </section>

                <section>
                    <label for="event-time">Время</label>
                    <input id="event-time" name="time" type="time" required>
                </section>

                <section>
                    <label for="event-venue">Место проведения</label>
                    <input id="event-venue" name="venue" type="text">
                </section>

                <section>
                    <label for="event-price">Цена</label>
                    <input id="event-price" name="price" type="number" min="0" step="0.01" inputmode="decimal">
                </section>

                <section>
                    <label for="event-category">Категория</label>
                    <select id="event-category" name="category">
                        <option value="">Выберите категорию</option>
                        <option value=".">.</option>
                    </select>
                </section>

                <section>
                    <label for="event-photos">Фотографии</label>
                    <input id="event-photos" name="photos" type="file" multiple accept="image/*">
                </section>

                <section>
                    <label for="event-seats">Количество мест</label>
                    <input id="event-seats" name="seats" type="number" min="0" step="1" inputmode="numeric">
                </section>

                <section>
                    <button type="submit">Сохранить</button>
                    <button type="reset">Отмена</button>
                </section>

            </div>

            <div>

                <section>
                    <label for="event-organizers">Организаторы</label>
                    <input id="event-organizers" name="organizers" type="text">
                </section>

                <section>
                    <label for="event-program">Программа</label>
                    <textarea id="event-program" name="program" rows="4"></textarea>
                </section>

                <section>
                    <label for="event-full-desc">Описание мероприятия (полное)</label>
                    <textarea id="event-full-desc" name="full_description" rows="6"></textarea>
                </section>
            </div>
        </form>
    </main>
</body>

</html>
